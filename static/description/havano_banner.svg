<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.55; }
    }
    @keyframes scanline {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes badgeFloatDelay {
      0%, 100% { transform: translateY(-4px); }
      50% { transform: translateY(0px); }
    }

    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 250px 100px;
    }
    .orb-2 {
      animation: pulseOrb2 10s ease-in-out infinite;
      transform-origin: 950px 250px;
    }
    .shimmer-line {
      animation: scanline 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .badge-float-1 { animation: badgeFloat 4s ease-in-out infinite; }
    .badge-float-2 { animation: badgeFloatDelay 4.5s ease-in-out infinite; }
    .badge-float-3 { animation: badgeFloat 5s ease-in-out infinite; }
    .badge-float-4 { animation: badgeFloatDelay 4.2s ease-in-out infinite; }
    .badge-float-5 { animation: badgeFloat 4.8s ease-in-out infinite; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 1.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.4px;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Ambient Glowing Orbs -->
  <g class="orb-1">
    <circle cx="240" cy="110" r="140" fill="#38bdf8" filter="url(#cardGlow)" opacity="0.35"/>
    <circle cx="280" cy="140" r="90" fill="#818cf8" filter="url(#cardGlow)" opacity="0.3"/>
  </g>
  <g class="orb-2">
    <circle cx="960" cy="240" r="160" fill="#a855f7" filter="url(#cardGlow)" opacity="0.3"/>
    <circle cx="900" cy="200" r="100" fill="#06b6d4" filter="url(#cardGlow)" opacity="0.25"/>
  </g>

  <!-- Tech Grid Overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="800" y1="0" x2="800" y2="380"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
  </g>

  <!-- Top Pills -->
  <g transform="translate(325, 42)">
    <rect width="255" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
    <circle cx="18" cy="16" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="21" fill="#e2e8f0" class="badge-text" font-size="12">ODOO 19.0 ENTERPRISE READY</text>
  </g>
  <g transform="translate(610, 42)">
    <rect width="265" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="16" y="21" font-size="13">👨‍💻</text>
    <text x="38" y="21" fill="#f1f5f9" class="badge-text" font-size="12">DEVELOPED BY TATENDA TEMBO</text>
  </g>

  <!-- Main Hero Brand Title -->
  <g transform="translate(600, 142)" text-anchor="middle">
    <text class="title-text" font-size="52" fill="url(#brandGrad)" filter="url(#glow)">HAVANO ALL IN ONE</text>
    <text class="title-text" font-size="52" fill="#ffffff" opacity="0.95">HAVANO ALL IN ONE</text>
  </g>

  <!-- Scanning Shimmer Divider Line -->
  <g transform="translate(200, 185)">
    <line x1="0" y1="0" x2="800" y2="0" stroke="#334155" stroke-width="2"/>
    <g class="shimmer-line">
      <line x1="0" y1="0" x2="300" y2="0" stroke="url(#shimmerGrad)" stroke-width="3"/>
    </g>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 222)" text-anchor="middle">
    <text class="subtitle-text" font-size="19" fill="#94a3b8">
      Next-Gen Enterprise Suite • Dynamic PDF Engine • Duplication Shield • Clinical Pharmacy • IFRS Analytics
    </text>
  </g>

  <!-- Floating Feature Badges Row -->
  <g transform="translate(75, 275)">
    <!-- Badge 1: PDF Engine -->
    <g class="badge-float-1" transform="translate(0, 0)">
      <rect width="195" height="52" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <text x="20" y="32" font-size="20">📑</text>
      <text x="52" y="27" fill="#f8fafc" class="badge-text">PDF Studio Engine</text>
      <text x="52" y="42" fill="#64748b" class="subtitle-text" font-size="11">Showline V3 + Preview</text>
    </g>

    <!-- Badge 2: Anti-Duplicate Shield -->
    <g class="badge-float-2" transform="translate(212, 0)">
      <rect width="195" height="52" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
      <text x="20" y="32" font-size="20">🛡️</text>
      <text x="52" y="27" fill="#f8fafc" class="badge-text">Data Integrity</text>
      <text x="52" y="42" fill="#64748b" class="subtitle-text" font-size="11">Anti-Duplicate Shield</text>
    </g>

    <!-- Badge 3: Clinical Pharmacy -->
    <g class="badge-float-3" transform="translate(424, 0)">
      <rect width="195" height="52" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="20" y="32" font-size="20">💊</text>
      <text x="52" y="27" fill="#f8fafc" class="badge-text">Pharmacy Module</text>
      <text x="52" y="42" fill="#64748b" class="subtitle-text" font-size="11">Dosage &amp; Script Tracking</text>
    </g>

    <!-- Badge 4: IFRS Reports -->
    <g class="badge-float-4" transform="translate(636, 0)">
      <rect width="195" height="52" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4"/>
      <text x="20" y="32" font-size="20">📊</text>
      <text x="52" y="27" fill="#f8fafc" class="badge-text">Financial Ratios</text>
      <text x="52" y="42" fill="#64748b" class="subtitle-text" font-size="11">IFRS P&amp;L &amp; Balance Sheet</text>
    </g>

    <!-- Badge 5: White Label -->
    <g class="badge-float-5" transform="translate(848, 0)">
      <rect width="195" height="52" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
      <text x="20" y="32" font-size="20">🎨</text>
      <text x="52" y="27" fill="#f8fafc" class="badge-text">Login &amp; UI Rebrand</text>
      <text x="52" y="42" fill="#64748b" class="subtitle-text" font-size="11">Custom Auth Screens</text>
    </g>
  </g>
</svg>
